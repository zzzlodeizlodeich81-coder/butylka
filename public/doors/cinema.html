<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Веб Видеоредактор с AI Переходами</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    .editor-container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .player-screen {
      position: relative;
      width: 100%;
      max-height: 60vh;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: aspect-ratio 0.3s ease;
    }
    .player-screen video {
      position: absolute;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
    }
    .player-screen video.active {
      display: block;
    }
    .text-overlay-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .text-box-element {
      position: absolute;
      cursor: move;
      pointer-events: auto;
      user-select: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .text-box-element.selected {
      outline: 2px dashed #4fc3f7;
    }
    .controls-panel {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, select, input {
      background: #2d2d2d;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #3d3d3d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .timeline-container {
      margin-top: 20px;
      background: #252525;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      position: relative;
    }
    .timeline-tracks {
      position: relative;
      height: 70px;
      background: #151515;
      margin-top: 10px;
      border-radius: 4px;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .track {
      position: absolute;
      top: 0; left: 0; height: 100%; width: 100%;
    }
    .clip {
      position: absolute;
      top: 5px; height: 60px;
      background: #333;
      border: 2px solid #555;
      border-radius: 4px;
      box-sizing: border-box;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .clip.selected { border-color: #4fc3f7; }
    .clip-thumbnails {
      display: flex;
      height: 38px;
      width: 100%;
      background: #000;
    }
    .clip-thumbnails img {
      height: 100%;
      flex: 1;
      object-fit: cover;
    }
    .clip-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 11px;
      background: rgba(0,0,0,0.7);
      height: 22px;
    }
    .transition-badge {
      background: #555;
      padding: 1px 4px;
      border-radius: 2px;
      cursor: pointer;
    }
    .audio-clip {
      position: absolute;
      top: 15px; height: 40px;
      background: #1b5e20;
      border: 1px solid #2e7d32;
      border-radius: 4px;
      box-sizing: border-box;
      padding: 5px;
      font-size: 12px;
    }

    .playhead {
      position: absolute;
      top: 0; bottom: 0; width: 14px;
      margin-left: -7px;
      background: transparent;
      cursor: ew-resize;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .playhead::before {
      content: '';
      position: absolute;
      top: 0;
      width: 12px;
      height: 12px;
      background: #ff5252;
      border-radius: 2px;
    }
    .playhead::after {
      content: '';
      position: absolute;
      top: 12px; bottom: 0;
      width: 2px;
      background: #ff5252;
    }

    .config-panel {
      margin-top: 10px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 4px;
      display: none;
      gap: 10px;
      align-items: center;
    }
    .ai-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .ai-modal-content {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      border: 1px solid #444;
    }
    .ai-preview-row {
      display: flex;
      gap: 15px;
      justify-content: space-around;
      margin: 15px 0;
    }
    .ai-preview-box img {
      width: 200px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border: 1px solid #555;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="editor-container">
  <!-- Плеер -->
  <div class="player-screen" id="playerScreen">
    <video id="videoA" playsinline></video>
    <video id="videoB" playsinline></video>
    <div class="text-overlay-layer" id="textOverlayLayer"></div>
  </div>

  <!-- Панель управления -->
  <div class="controls-panel">
    <input type="file" id="fileInput" accept="video/*" multiple style="display: none;">
    <button onclick="document.getElementById('fileInput').click()">📁 Загрузить видео</button>

    <input type="file" id="audioInput" accept="audio/*" multiple style="display: none;">
    <button onclick="document.getElementById('audioInput').click()">🎵 Аудио</button>

    <button id="playBtn" disabled>▶ Пуск</button>
    <button id="splitBtn" disabled>✂ Разрезать</button>
    <button id="deleteBtn" disabled>🗑 Удалить</button>
    <button id="snapshotBtn" disabled>📸 Снимок</button>
    <button id="addTextBtn" disabled>✍ Текст</button>
    <button id="muteBtn" disabled>🔊 Звук: Вкл</button>
    <button id="aiTransitionBtn" disabled style="background: #673ab7;">✨ AI Переход (Kling)</button>

    <select id="exportRes">
      <option value="original" selected>Исходное разрешение (Авто)</option>
      <option value="720x1280">Вертикальное (HD 720p)</option>
      <option value="1080x1920">Вертикальное (Full HD 1080p)</option>
      <option value="1280x720">Горизонтальное (HD)</option>
      <option value="1920x1080">Горизонтальное (Full HD)</option>
    </select>
    <select id="exportFps">
      <option value="30" selected>30 FPS</option>
      <option value="60">60 FPS</option>
    </select>
    <button id="exportBtn" disabled>✨ Экспорт (WebM)</button>
  </div>

  <!-- Панель настроек текста -->
  <div class="config-panel" id="textConfigPanel">
    <span>Текст:</span>
    <input type="text" id="textContentInput" style="flex:1;">
    <input type="color" id="textColorInput" value="#ffffff">
    <select id="textStyleSelect">
      <option value="classic">Классический</option>
      <option value="neon">Неон</option>
      <option value="outline">Обводка</option>
      <option value="retro">Ретро</option>
    </select>
    <select id="textSizeSelect">
      <option value="24">24px</option>
      <option value="36" selected>36px</option>
      <option value="48">48px</option>
      <option value="64">64px</option>
    </select>
    <button id="deleteTextBtn" style="background:#b71c1c;">Удалить текст</button>
  </div>

  <!-- Таймлайн -->
  <div class="timeline-container">
    <div id="timeDisplay">00:00.0 / 00:00.0</div>
    <div class="timeline-tracks" id="timelineTracks">
      <div class="playhead" id="playhead"></div>
      <div class="track" id="videoTrack" style="z-index: 2;"></div>
      <div class="track" id="audioTrack" style="z-index: 1;"></div>
    </div>
  </div>
</div>

<!-- Модальное окно для AI-перехода -->
<div class="ai-modal" id="aiModal">
  <div class="ai-modal-content">
    <h3>Генерация перехода через Kling AI</h3>
    <p>💡 <b>Совет:</b> Кадры вырезаются и отправляются напрямую в n8n.</p>
    <p style="color: #ff5252; font-size: 13px; background: rgba(255,82,82,0.1); padding: 8px; border-radius: 4px;">⚠️ <b>Внимание:</b> Генерация перехода занимает 3–4 минуты. Не нажимайте кнопку проверки раньше этого времени!</p>
    <div class="ai-preview-row">
      <div class="ai-preview-box">
        <div style="font-size:12px; margin-bottom:5px;">Конец клипа А (Start):</div>
        <img id="aiFrameA" src="" alt="Frame A">
      </div>
      <div class="ai-preview-box">
        <div style="font-size:12px; margin-bottom:5px;">Начало клипа Б (End):</div>
        <img id="aiFrameB" src="" alt="Frame B">
      </div>
    </div>
    <div style="margin-top: 15px;">
      <label style="font-size:13px; display:block; margin-bottom:5px;">Промпт:</label>
      <input type="text" id="aiPromptInput" value="Cinematic smooth morphing transition, cinematic lighting, 4k" style="width:100%; box-sizing:border-box; margin-bottom:15px;">
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
      <button id="aiCloseModalBtn" style="background:#444;">Закрыть</button>
      <button id="aiSendToN8nBtn" style="background:#2e7d32;">🚀 Отправить в n8n</button>
      <button id="aiCheckStatusBtn" style="background:#0277bd;" disabled>🔄 Проверить статус / Загрузить</button>
    </div>
  </div>
</div>

<audio id="externalAudio"></audio>

<script>
  const fileInput = document.getElementById('fileInput');
  const audioInput = document.getElementById('audioInput');
  const videoA = document.getElementById('videoA');
  const videoB = document.getElementById('videoB');
  const externalAudio = document.getElementById('externalAudio');
  const playerScreen = document.getElementById('playerScreen');
  
  const playBtn = document.getElementById('playBtn');
  const splitBtn = document.getElementById('splitBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const snapshotBtn = document.getElementById('snapshotBtn');
  const addTextBtn = document.getElementById('addTextBtn');
  const muteBtn = document.getElementById('muteBtn');
  const aiTransitionBtn = document.getElementById('aiTransitionBtn');
  const exportBtn = document.getElementById('exportBtn');

  const exportRes = document.getElementById('exportRes');
  const exportFps = document.getElementById('exportFps');
  const textConfigPanel = document.getElementById('textConfigPanel');
  const textContentInput = document.getElementById('textContentInput');
  const textColorInput = document.getElementById('textColorInput');
  const textStyleSelect = document.getElementById('textStyleSelect');
  const textSizeSelect = document.getElementById('textSizeSelect');
  const deleteTextBtn = document.getElementById('deleteTextBtn');
  const textOverlayLayer = document.getElementById('textOverlayLayer');

  const timeDisplay = document.getElementById('timeDisplay');
  const videoTrack = document.getElementById('videoTrack');
  const audioTrack = document.getElementById('audioTrack');
  const playhead = document.getElementById('playhead');
  const timelineTracks = document.getElementById('timelineTracks');

  const aiModal = document.getElementById('aiModal');
  const aiCloseModalBtn = document.getElementById('aiCloseModalBtn');
  const aiSendToN8nBtn = document.getElementById('aiSendToN8nBtn');
  const aiCheckStatusBtn = document.getElementById('aiCheckStatusBtn');
  const aiFrameA = document.getElementById('aiFrameA');
  const aiFrameB = document.getElementById('aiFrameB');
  const aiPromptInput = document.getElementById('aiPromptInput');

  let videoClips = [];
  let audioClips = [];
  let textElements = [];
  let selectedObject = null;
  let selectedTextId = null;

  let currentClipIndex = 0;
  let activeVideo = videoA;
  let nextVideo = videoB;
  let totalDuration = 0;
  let currentGlobalTime = 0;
  let isMuted = false;
  let isPlaying = false;
  let animId = null;

  let lastExtractedFrames = { a: null, b: null };

  let isDraggingPlayhead = false;
  playhead.addEventListener('mousedown', (e) => { isDraggingPlayhead = true; e.stopPropagation(); });
  window.addEventListener('mousemove', (e) => {
    if (!isDraggingPlayhead || totalDuration <= 0) return;
    const rect = timelineTracks.getBoundingClientRect();
    let x = e.clientX - rect.left + timelineTracks.scrollLeft;
    let percentage = Math.max(0, Math.min(1, x / timelineTracks.clientWidth));
    seekToGlobalTime(percentage * totalDuration);
  });
  window.addEventListener('mouseup', () => { isDraggingPlayhead = false; });

  timelineTracks.addEventListener('click', (e) => {
    if (e.target === playhead || e.target.closest('.clip') || e.target.closest('.audio-clip')) return;
    if (totalDuration <= 0) return;
    const rect = timelineTracks.getBoundingClientRect();
    let x = e.clientX - rect.left + timelineTracks.scrollLeft;
    let percentage = Math.max(0, Math.min(1, x / timelineTracks.clientWidth));
    seekToGlobalTime(percentage * totalDuration);
  });

  async function generateThumbnails(clip) {
    if (clip.thumbnails) return;
    clip.thumbnails = [];
    const v = document.createElement('video');
    v.src = clip.src; v.muted = true; v.preload = 'metadata';
    await new Promise(r => { v.onloadedmetadata = r; });

    const count = 4;
    const clipLen = clip.end - clip.start;
    const step = clipLen / (count + 1);
    const canvas = document.createElement('canvas');
    canvas.width = 60; canvas.height = 36;
    const ctx = canvas.getContext('2d');

    for (let i = 1; i <= count; i++) {
      const time = clip.start + (i * step);
      v.currentTime = Math.min(time, clip.duration - 0.1);
      
      await new Promise(r => {
        const onSeeked = () => {
          v.removeEventListener('seeked', onSeeked);
          requestAnimationFrame(r);
        };
        v.addEventListener('seeked', onSeeked);
        setTimeout(r, 300);
      });

      try {
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
        clip.thumbnails.push(canvas.toDataURL('image/jpeg', 0.4));
        renderVideoTrack();
      } catch (e) { break; }
    }
  }

  function updatePlayerAspect() {
    if (videoClips.length > 0 && activeVideo.videoWidth && activeVideo.videoHeight) {
      playerScreen.style.aspectRatio = `${activeVideo.videoWidth} / ${activeVideo.videoHeight}`;
    }
  }

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    for (const file of files) {
      const url = URL.createObjectURL(file);
      const tempVid = document.createElement('video');
      tempVid.src = url;
      tempVid.preload = 'metadata';
      await new Promise(r => {
        tempVid.onloadedmetadata = r;
        setTimeout(r, 500);
      });

      let duration = tempVid.duration;
      if (!duration || isNaN(duration) || !isFinite(duration)) {
        duration = 5.0;
      }

      const clip = {
        id: 'v_' + Date.now() + Math.random(),
        file, src: url,
        start: 0, end: duration,
        duration: duration,
        transition: 'none',
        thumbnails: null,
        width: tempVid.videoWidth || 1280,
        height: tempVid.videoHeight || 720
      };
      videoClips.push(clip);
      generateThumbnails(clip);
    }

    if (!selectedObject && videoClips.length) selectedObject = { type: 'video', id: videoClips[0].id };
    enableControls();
    recalculateTimeline();
    seekToGlobalTime(0);
    updatePlayerAspect();
  });

  audioInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    for (const file of files) {
      const url = URL.createObjectURL(file);
      const tempAud = document.createElement('audio');
      tempAud.src = url;
      await new Promise(r => {
        tempAud.onloadedmetadata = r;
        setTimeout(r, 500);
      });
      let duration = tempAud.duration;
      if (!duration || isNaN(duration) || !isFinite(duration)) duration = 5.0;

      audioClips.push({ id: 'a_' + Date.now() + Math.random(), file, src: url, start: 0, end: duration, duration: duration, timelineOffset: 0 });
    }

    isMuted = true;
    activeVideo.muted = true;
    nextVideo.muted = true;
    muteBtn.innerText = '🔇 Звук: Выкл';

    enableControls();
    recalculateTimeline();
    seekToGlobalTime(currentGlobalTime);
  });

  addTextBtn.addEventListener('click', () => {
    const newText = { id: 't_' + Date.now(), text: 'Ваш текст', x: 50, y: 50, color: '#ffffff', style: 'classic', size: 36 };
    textElements.push(newText);
    selectText(newText.id);
    renderTextOverlays();
  });

  function selectText(id) {
    selectedTextId = id;
    selectedObject = null;
    const txt = textElements.find(t => t.id === id);
    if (txt) {
      textConfigPanel.style.display = 'flex';
      textContentInput.value = txt.text;
      textColorInput.value = txt.color || '#ffffff';
      textStyleSelect.value = txt.style;
      textSizeSelect.value = txt.size;
    } else {
      textConfigPanel.style.display = 'none';
    }
    renderTextOverlays();
    recalculateTimeline();
  }

  textContentInput.addEventListener('input', () => { const txt = textElements.find(t => t.id === selectedTextId); if (txt) { txt.text = textContentInput.value; renderTextOverlays(); } });
  textColorInput.addEventListener('input', () => { const txt = textElements.find(t => t.id === selectedTextId); if (txt) { txt.color = textColorInput.value; renderTextOverlays(); } });
  textStyleSelect.addEventListener('change', () => { const txt = textElements.find(t => t.id === selectedTextId); if (txt) { txt.style = textStyleSelect.value; renderTextOverlays(); } });
  textSizeSelect.addEventListener('change', () => { const txt = textElements.find(t => t.id === selectedTextId); if (txt) { txt.size = parseInt(textSizeSelect.value); renderTextOverlays(); } });
  deleteTextBtn.addEventListener('click', () => {
    textElements = textElements.filter(t => t.id !== selectedTextId);
    selectedTextId = null; textConfigPanel.style.display = 'none'; renderTextOverlays();
  });

  function renderTextOverlays() {
    textOverlayLayer.innerHTML = '';
    textElements.forEach(item => {
      const el = document.createElement('div');
      el.className = `text-box-element ${selectedTextId === item.id ? 'selected' : ''}`;
      el.style.left = `${item.x}%`;
      el.style.top = `${item.y}%`;
      el.style.fontSize = `${item.size}px`;
      el.style.color = item.color || '#ffffff';
      el.innerText = item.text;
      applyTextStyle(el, item.style, item.color);

      el.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        selectText(item.id);
        const rect = textOverlayLayer.getBoundingClientRect();
        let mouseX = e.clientX, mouseY = e.clientY, isDragging = true;
        const onMouseMove = (ME) => { if (isDragging) { mouseX = ME.clientX; mouseY = ME.clientY; } };
        const updatePos = () => {
          if (!isDragging) return;
          item.x = Math.max(5, Math.min(95, ((mouseX - rect.left) / rect.width) * 100));
          item.y = Math.max(5, Math.min(95, ((mouseY - rect.top) / rect.height) * 100));
          el.style.left = `${item.x}%`; el.style.top = `${item.y}%`;
          requestAnimationFrame(updatePos);
        };
        requestAnimationFrame(updatePos);
        const onMouseUp = () => { isDragging = false; window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp); };
        window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
      });
      textOverlayLayer.appendChild(el);
    });
  }

  function applyTextStyle(el, style, color = '#fff') {
    el.style.fontFamily = 'sans-serif'; el.style.fontWeight = 'bold';
    if (style === 'classic') { el.style.color = color; el.style.textShadow = '2px 2px 4px rgba(0,0,0,0.8)'; }
    else if (style === 'neon') { el.style.color = color; el.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`; }
    else if (style === 'outline') { el.style.color = color; el.style.webkitTextStroke = '1px black'; }
    else if (style === 'retro') { el.style.color = color; el.style.textShadow = '2px 2px 0px #d32f2f'; }
  }

  function drawTextOnCanvas(ctx, w, h, item) {
    ctx.save();
    ctx.font = `bold ${Math.round(item.size * (w / 950))}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const x = (item.x / 100) * w, y = (item.y / 100) * h;
    const col = item.color || '#ffffff';
    if (item.style === 'classic') { ctx.fillStyle = col; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10; }
    else if (item.style === 'neon') { ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 15; }
    else if (item.style === 'outline') { ctx.fillStyle = col; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(item.text, x, y); }
    else if (item.style === 'retro') { ctx.fillStyle = col; ctx.shadowColor = '#d32f2f'; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4; }
    ctx.fillText(item.text, x, y);
    ctx.restore();
  }

  function enableControls() {
    playBtn.disabled = false; splitBtn.disabled = false; deleteBtn.disabled = false;
    snapshotBtn.disabled = false; addTextBtn.disabled = false; muteBtn.disabled = false; 
    aiTransitionBtn.disabled = false; exportBtn.disabled = false;
  }

  function formatTime(s) {
    if (isNaN(s) || !isFinite(s)) return "00:00.0";
    const m = Math.floor(s / 60), sec = Math.floor(s % 60), ms = Math.floor((s % 1) * 10);
    return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms}`;
  }

  function recalculateTimeline() {
    totalDuration = videoClips.reduce((acc, c) => acc + Math.max(0, (c.end - c.start)), 0);
    if (isNaN(totalDuration) || !isFinite(totalDuration)) totalDuration = 0;
    renderVideoTrack(); renderAudioTrack();
    timeDisplay.innerText = `${formatTime(currentGlobalTime)} / ${formatTime(totalDuration)}`;
  }

  function renderVideoTrack() {
    videoTrack.innerHTML = '';
    let currentPos = 0;
    videoClips.forEach((clip, index) => {
      const len = Math.max(0.1, clip.end - clip.start);
      const el = document.createElement('div');
      el.className = `clip ${selectedObject?.id === clip.id ? 'selected' : ''}`;
      el.style.left = `${totalDuration ? (currentPos / totalDuration) * 100 : 0}%`;
      el.style.width = `${totalDuration ? (len / totalDuration) * 100 : 0}%`;
      
      const thumbsContainer = document.createElement('div');
      thumbsContainer.className = 'clip-thumbnails';
      if (clip.thumbnails) {
        clip.thumbnails.forEach(src => {
          const img = document.createElement('img'); img.src = src;
          thumbsContainer.appendChild(img);
        });
      }
      el.appendChild(thumbsContainer);

      const footer = document.createElement('div');
      footer.className = 'clip-footer';
      const title = document.createElement('span');
      title.innerText = `${len.toFixed(1)}s`;
      footer.appendChild(title);

      if (index < videoClips.length - 1) {
        const btn = document.createElement('span');
        btn.className = 'transition-badge';
        btn.innerText = clip.transition === 'none' ? '⚡ Склейка' : (clip.transition === 'fade' ? '🌑 Затух' : '✨ AI');
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const modes = ['none', 'fade', 'ai'];
          clip.transition = modes[(modes.indexOf(clip.transition) + 1) % modes.length];
          renderVideoTrack();
        });
        footer.appendChild(btn);
      }
      el.appendChild(footer);

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedTextId = null; textConfigPanel.style.display = 'none';
        selectedObject = { type: 'video', id: clip.id };
        renderVideoTrack();
      });
      videoTrack.appendChild(el);
      currentPos += len;
    });
  }

  function renderAudioTrack() {
    audioTrack.innerHTML = '';
    audioClips.forEach((clip) => {
      const len = Math.max(0.1, clip.end - clip.start);
      const el = document.createElement('div');
      el.className = 'audio-clip';
      el.style.left = `${totalDuration ? (clip.timelineOffset / totalDuration) * 100 : 0}%`;
      el.style.width = `${totalDuration ? (len / totalDuration) * 100 : 0}%`;
      el.innerText = `🎵 ${len.toFixed(1)}s`;
      audioTrack.appendChild(el);
    });
  }

  function getVideoStateAtTime(gTime) {
    let accumulated = 0;
    for (let i = 0; i < videoClips.length; i++) {
      const clip = videoClips[i], len = clip.end - clip.start;
      if (gTime <= accumulated + len) return { index: i, clip, localTime: clip.start + (gTime - accumulated) };
      accumulated += len;
    }
    const last = videoClips.length - 1;
    if (last < 0) return null;
    return { index: last, clip: videoClips[last], localTime: videoClips[last].end };
  }

  function getAudioStateAtTime(gTime) {
    for (let i = 0; i < audioClips.length; i++) {
      const clip = audioClips[i];
      if (gTime >= clip.timelineOffset && gTime <= clip.timelineOffset + (clip.end - clip.start)) {
        return { clip, audioTime: clip.start + (gTime - clip.timelineOffset) };
      }
    }
    return null;
  }

  function swapVideos() {
    activeVideo.classList.remove('active'); activeVideo.pause();
    const temp = activeVideo; activeVideo = nextVideo; nextVideo = temp;
    activeVideo.classList.add('active');
    updatePlayerAspect();
  }

  function syncAudio(gTime, force = false) {
    const st = getAudioStateAtTime(gTime);
    if (st) {
      if (externalAudio.src !== st.clip.src) externalAudio.src = st.clip.src, force = true;
      if (force || Math.abs(externalAudio.currentTime - st.audioTime) > 0.15) externalAudio.currentTime = st.audioTime;
      if (isPlaying && externalAudio.paused) externalAudio.play().catch(() => {});
    } else if (!externalAudio.paused) externalAudio.pause();
  }

  function seekToGlobalTime(gTime) {
    if (isNaN(gTime) || !isFinite(gTime)) gTime = 0;
    currentGlobalTime = Math.max(0, Math.min(gTime, totalDuration));
    const st = getVideoStateAtTime(currentGlobalTime);
    if (!st) return;
    currentClipIndex = st.index;
    if (activeVideo.src !== st.clip.src) activeVideo.src = st.clip.src;
    
    let safeTime = st.localTime;
    if (isNaN(safeTime) || !isFinite(safeTime)) safeTime = st.clip.start;
    activeVideo.currentTime = Math.max(0, Math.min(safeTime, st.clip.duration || safeTime));
    activeVideo.muted = isMuted;

    if (videoClips[currentClipIndex + 1]) {
      if (nextVideo.src !== videoClips[currentClipIndex + 1].src) nextVideo.src = videoClips[currentClipIndex + 1].src;
      nextVideo.currentTime = videoClips[currentClipIndex + 1].start;
      nextVideo.muted = isMuted;
    }
    syncAudio(currentGlobalTime, true);
    playhead.style.left = `${totalDuration ? (currentGlobalTime / totalDuration) * 100 : 0}%`;
    timeDisplay.innerText = `${formatTime(currentGlobalTime)} / ${formatTime(totalDuration)}`;
    updatePlayerAspect();
  }

  function updateLoop() {
    if (!isPlaying) return;
    let elapsed = 0;
    for (let i = 0; i < currentClipIndex; i++) elapsed += (videoClips[i].end - videoClips[i].start);
    const clip = videoClips[currentClipIndex];
    if (!clip) { pause(); return; }
    
    currentGlobalTime = elapsed + (activeVideo.currentTime - clip.start);
    syncAudio(currentGlobalTime, false);

    if (activeVideo.currentTime >= clip.end - 0.05) {
      if (currentClipIndex < videoClips.length - 1) {
        currentClipIndex++; swapVideos();
        activeVideo.currentTime = videoClips[currentClipIndex].start;
        activeVideo.play();
      } else { pause(); seekToGlobalTime(0); return; }
    }
    playhead.style.left = `${totalDuration ? (currentGlobalTime / totalDuration) * 100 : 0}%`;
    timeDisplay.innerText = `${formatTime(currentGlobalTime)} / ${formatTime(totalDuration)}`;
    animId = requestAnimationFrame(updateLoop);
  }

  function play() { if (!videoClips.length) return; isPlaying = true; playBtn.innerText = '⏸ Пауза'; activeVideo.play(); syncAudio(currentGlobalTime, true); animId = requestAnimationFrame(updateLoop); }
  function pause() { isPlaying = false; playBtn.innerText = '▶ Пуск'; activeVideo.pause(); externalAudio.pause(); if (animId) cancelAnimationFrame(animId); }

  playBtn.addEventListener('click', () => isPlaying ? pause() : play());
  muteBtn.addEventListener('click', () => { isMuted = !isMuted; activeVideo.muted = isMuted; nextVideo.muted = isMuted; muteBtn.innerText = isMuted ? '🔇 Звук: Выкл' : '🔊 Звук: Вкл'; });

  // --- AI Переход (Прямая отправка в n8n) ---
  aiTransitionBtn.addEventListener('click', async () => {
    if (videoClips.length < 2) return;
    pause();
    let targetIndex = 0;
    if (selectedObject && selectedObject.type === 'video') {
      const idx = videoClips.findIndex(c => c.id === selectedObject.id);
      if (idx !== -1 && idx < videoClips.length - 1) targetIndex = idx;
    }
    const clipA = videoClips[targetIndex], clipB = videoClips[targetIndex + 1];

    const vA = document.createElement('video'); vA.src = clipA.src; vA.muted = true; vA.preload = 'auto';
    await new Promise(r => vA.onloadedmetadata = r);
    vA.currentTime = Math.max(0, clipA.end - 0.05);
    await new Promise(r => {
      const onSeeked = () => { vA.removeEventListener('seeked', onSeeked); requestAnimationFrame(r); };
      vA.addEventListener('seeked', onSeeked);
      setTimeout(r, 400);
    });
    const canvasA = document.createElement('canvas');
    canvasA.width = vA.videoWidth || 1280; canvasA.height = vA.videoHeight || 720;
    canvasA.getContext('2d').drawImage(vA, 0, 0);
    lastExtractedFrames.a = canvasA.toDataURL('image/jpeg', 0.9);

    const vB = document.createElement('video'); vB.src = clipB.src; vB.muted = true; vB.preload = 'auto';
    await new Promise(r => vB.onloadedmetadata = r);
    vB.currentTime = clipB.start;
    await new Promise(r => {
      const onSeeked = () => { vB.removeEventListener('seeked', onSeeked); requestAnimationFrame(r); };
      vB.addEventListener('seeked', onSeeked);
      setTimeout(r, 400);
    });
    const canvasB = document.createElement('canvas');
    canvasB.width = vB.videoWidth || 1280; canvasB.height = vB.videoHeight || 720;
    canvasB.getContext('2d').drawImage(vB, 0, 0);
    lastExtractedFrames.b = canvasB.toDataURL('image/jpeg', 0.9);

    aiFrameA.src = lastExtractedFrames.a; 
    aiFrameB.src = lastExtractedFrames.b;
    aiCheckStatusBtn.disabled = true; // Сбрасываем кнопку проверки при открытии нового диалога
    aiModal.style.display = 'flex';
  });

  aiCloseModalBtn.addEventListener('click', () => { aiModal.style.display = 'none'; });

  aiSendToN8nBtn.addEventListener('click', async () => {
    aiSendToN8nBtn.innerText = '🚀 Отправка в n8n...';
    aiSendToN8nBtn.disabled = true;

    try {
      const response = await fetch('https://xxvkadr.ru/webhook/d83e0ff6-9711-434f-bf84-277ca68309cc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: aiPromptInput.value,
          startBase64: lastExtractedFrames.a,
          endBase64: lastExtractedFrames.b
        })
      });
      
      const result = await response.json();
      console.log("Ответ от n8n:", result);

      alert("Запрос отправлен в n8n! Подождите 3–4 минуты, пока нейросеть сгенерирует видео, затем нажмите кнопку «Проверить статус / Загрузить».");
      aiCheckStatusBtn.disabled = false; // Разрешаем проверку
    } catch (err) {
      alert("Ошибка отправки: " + err.message);
    } finally {
      aiSendToN8nBtn.disabled = false;
      aiSendToN8nBtn.innerText = '🚀 Отправить в n8n';
    }
  });

  // Логика кнопки проверки статуса / получения готового видео из n8n
  aiCheckStatusBtn.addEventListener('click', async () => {
    aiCheckStatusBtn.innerText = '⏳ Проверка...';
    aiCheckStatusBtn.disabled = true;

    let targetIndex = 0;
    if (selectedObject && selectedObject.type === 'video') {
      const idx = videoClips.findIndex(c => c.id === selectedObject.id);
      if (idx !== -1 && idx < videoClips.length - 1) targetIndex = idx;
    }

    try {
      const response = await fetch('https://xxvkadr.ru/webhook/d83e0ff6-9711-434f-bf84-277ca68309cc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'check_status',
          clipIndexA: targetIndex,
          clipIndexB: targetIndex + 1
        })
      });

      const result = await response.json();
      console.log("Ответ от n8n (статус):", result);

      if (result && result.video_url) {
        const transitionClip = {
          id: 'v_trans_' + Date.now(),
          file: null,
          src: result.video_url,
          start: 0,
          end: 3.0,
          duration: 3.0,
          transition: 'none',
          thumbnails: null,
          width: 1280,
          height: 720
        };

        const insertIndex = (result.clipIndexB !== undefined) ? result.clipIndexB : (targetIndex + 1);
        videoClips.splice(insertIndex, 0, transitionClip);
        await generateThumbnails(transitionClip);
        recalculateTimeline();
        
        alert("AI-переход успешно получен и добавлен на таймлайн!");
        aiModal.style.display = 'none';
      } else {
        alert("Видео еще не готово или обрабатывается. Попробуйте нажать кнопку еще раз через минуту.");
      }
    } catch (err) {
      alert("Ошибка проверки: " + err.message);
    } finally {
      aiCheckStatusBtn.disabled = false;
      aiCheckStatusBtn.innerText = '🔄 Проверить статус / Загрузить';
    }
  });

  splitBtn.addEventListener('click', () => {
    if (!selectedObject || selectedObject.type !== 'video') return;
    const st = getVideoStateAtTime(currentGlobalTime);
    if (st && st.localTime > st.clip.start + 0.1 && st.localTime < st.clip.end - 0.1) {
      const origEnd = st.clip.end;
      st.clip.end = st.localTime;
      const newClip = {
        id: 'v_' + Date.now(), file: st.clip.file, src: st.clip.src,
        start: st.localTime, end: origEnd, duration: st.clip.duration, transition: 'none', thumbnails: null,
        width: st.clip.width, height: st.clip.height
      };
      generateThumbnails(st.clip); generateThumbnails(newClip);
      videoClips.splice(st.index + 1, 0, newClip);
      recalculateTimeline();
    }
  });

  deleteBtn.addEventListener('click', () => {
    if (!selectedObject || videoClips.length <= 1) return;
    videoClips = videoClips.filter(c => c.id !== selectedObject.id);
    selectedObject = videoClips[0] ? { type: 'video', id: videoClips[0].id } : null;
    recalculateTimeline(); seekToGlobalTime(0); updatePlayerAspect();
  });

  snapshotBtn.addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = activeVideo.videoWidth || 1280; canvas.height = activeVideo.videoHeight || 720;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(activeVideo, 0, 0, canvas.width, canvas.height);
    textElements.forEach(item => drawTextOnCanvas(ctx, canvas.width, canvas.height, item));
    const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = `snapshot_${Date.now()}.png`; a.click();
  });

  exportBtn.addEventListener('click', async () => {
    if (!videoClips.length) return;
    pause(); 
    exportBtn.disabled = true;
    exportBtn.innerText = '⏳ Рендер...';

    let w, h;
    if (exportRes.value === 'original') {
      w = videoClips[0].width || 1080;
      h = videoClips[0].height || 1920;
    } else {
      [w, h] = exportRes.value.split('x').map(Number);
    }

    const fps = parseInt(exportFps.value);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', { alpha: false });

    const stream = canvas.captureStream(fps);
    let recorder;
    try {
      recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
    } catch (e) {
      try { recorder = new MediaRecorder(stream, { mimeType: 'video/webm' }); }
      catch (err) { recorder = new MediaRecorder(stream); }
    }

    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `export_${Date.now()}.webm`;
      a.click();
      exportBtn.disabled = false;
      exportBtn.innerText = '✨ Экспорт (WebM)';
    };

    recorder.start();

    const exportVid = document.createElement('video');
    exportVid.muted = true; exportVid.playsInline = true;

    for (let i = 0; i < videoClips.length; i++) {
      const clip = videoClips[i];
      exportVid.src = clip.src;
      await new Promise(r => exportVid.onloadedmetadata = r);

      let t = clip.start;
      const step = 1 / fps;

      while (t <= clip.end) {
        exportVid.currentTime = t;
        await new Promise(r => {
          const seekCheck = () => { exportVid.removeEventListener('seeked', seekCheck); r(); };
          exportVid.addEventListener('seeked', seekCheck);
          setTimeout(r, 100);
        });

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const vw = exportVid.videoWidth || w;
        const vh = exportVid.videoHeight || h;
        
        const hRatio = w / vw;
        const vRatio = h / vh;
        const ratio = Math.max(hRatio, vRatio);
        const centerShiftX = (w - vw * ratio) / 2;
        const centerShiftY = (h - vh * ratio) / 2;

        ctx.drawImage(exportVid, 0, 0, vw, vh, centerShiftX, centerShiftY, vw * ratio, vh * ratio);
        textElements.forEach(item => drawTextOnCanvas(ctx, w, h, item));

        await new Promise(r => setTimeout(r, 1000 / fps));
        t += step;
      }
    }
    recorder.stop();
  });
</script>
