<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вёрстка двора</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1a120c; color: #f4e4c4; font: 20px/1.35 system-ui, sans-serif; }
    header { padding: 14px 16px 8px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; }
    p.hint { margin: 6px 0 0; color: #c4a574; font-size: 16px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; }
    #stage { position: relative; background: #0c0708; min-height: 240px; overflow: auto; }
    #pic { display: block; max-width: 100%; height: auto; user-select: none; }
    #over { position: absolute; left: 0; top: 0; cursor: crosshair; }
    aside { display: flex; flex-direction: column; gap: 10px; }
    button, label.file { background: #2a1a0c; color: #f4e4c4; border: 1px solid #c4a574; border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; }
    button.on { background: #f4e4c4; color: #1a120c; }
    button.go { background: #2a6f4e; border-color: #2a6f4e; color: white; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    input[type="text"] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid #c4a574; background: #0c0708; color: #f4e4c4; }
    #live { background: #0c0708; border-radius: 12px; padding: 12px; min-height: 132px; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
    #list { display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow: auto; }
    .item { background: #0c0708; border-radius: 12px; padding: 8px 10px; font-size: 16px; }
    .item button { padding: 6px 10px; font-size: 16px; margin-top: 6px; }
    label.check { display: flex; gap: 8px; align-items: center; font-size: 16px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Вёрстка</h1>
    <p class="hint">Картинка с диска. Клик или протяжка. Числа в окошке. «Зафиксировать», потом «Скопировать» и вставь мне в чат.</p>
  </header>
  <main>
    <div id="stage">
      <img id="pic" alt="">
      <canvas id="over"></canvas>
    </div>
    <aside>
      <label class="file">Открыть картинку<input id="file" type="file" accept="image/*" hidden></label>
      <div class="row">
        <button type="button" id="m-point" class="on">Точка</button>
        <button type="button" id="m-box">Квадрат</button>
        <button type="button" id="m-circle">Круг</button>
      </div>
      <label class="check"><input id="even" type="checkbox" checked> Ровные стороны у квадрата</label>
      <input id="name" type="text" placeholder="Имя: крыша, буква, человечек" maxlength="40">
      <div id="live">Сначала открой картинку.</div>
      <button type="button" class="go" id="fix">Зафиксировать</button>
      <div id="list"></div>
      <button type="button" id="copy">Скопировать всё</button>
    </aside>
  </main>
  <script>
    const pic = document.getElementById("pic");
    const over = document.getElementById("over");
    const ctx = over.getContext("2d");
    const live = document.getElementById("live");
    const nameBox = document.getElementById("name");
    const even = document.getElementById("even");
    let mode = "point";
    let draft = null;
    let drag = null;
    let items = [];
    let fileName = "";

    function pct(n) { return Math.round(n * 10) / 10; }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function fit() {
      const w = pic.clientWidth;
      const h = pic.clientHeight;
      if (!w || !h) return;
      over.width = w;
      over.height = h;
      over.style.width = w + "px";
      over.style.height = h + "px";
      draw();
    }

    function at(ev) {
      const r = over.getBoundingClientRect();
      const x = clamp((ev.clientX - r.left) / r.width * 100, 0, 100);
      const y = clamp((ev.clientY - r.top) / r.height * 100, 0, 100);
      return { x: pct(x), y: pct(y) };
    }

    function square(a, b) {
      let w = b.x - a.x;
      let h = b.y - a.y;
      if (even.checked) {
        const s = Math.max(Math.abs(w), Math.abs(h));
        w = Math.sign(w || 1) * s;
        h = Math.sign(h || 1) * s;
      }
      const x = w < 0 ? a.x + w : a.x;
      const y = h < 0 ? a.y + h : a.y;
      return { kind: "box", x: pct(x), y: pct(y), w: pct(Math.abs(w)), h: pct(Math.abs(h)) };
    }

    function circle(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const r = pct(Math.sqrt(dx * dx + dy * dy));
      return { kind: "circle", x: a.x, y: a.y, r };
    }

    function textOf(obj) {
      const title = obj.name || "без имени";
      if (obj.kind === "point") return "точка «" + title + "» x " + obj.x + "% y " + obj.y + "%";
      if (obj.kind === "circle") return "круг «" + title + "» точка " + obj.x + "% " + obj.y + "% радиус " + obj.r + "%";
      if (obj.w === obj.h) return "квадрат «" + title + "» x " + obj.x + "% y " + obj.y + "% сторона " + obj.w + "%";
      return "квадрат «" + title + "» x " + obj.x + "% y " + obj.y + "% ширина " + obj.w + "% высота " + obj.h + "%";
    }

    function show(obj) {
      if (!pic.src) { live.textContent = "Сначала открой картинку."; return; }
      if (!obj) { live.textContent = "Кликни по картинке."; return; }
      if (obj.kind === "point") {
        live.textContent = "Точка\nX  " + obj.x + "%\nY  " + obj.y + "%";
      } else if (obj.kind === "circle") {
        live.textContent = "Круг\nX  " + obj.x + "%\nY  " + obj.y + "%\nрадиус  " + obj.r + "%";
      } else if (obj.w === obj.h) {
        live.textContent = "Квадрат\nX  " + obj.x + "%\nY  " + obj.y + "%\nсторона  " + obj.w + "%";
      } else {
        live.textContent = "Квадрат\nX  " + obj.x + "%\nY  " + obj.y + "%\nширина  " + obj.w + "%\nвысота  " + obj.h + "%";
      }
    }

    function drawOne(obj, color) {
      const W = over.width;
      const H = over.height;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;
      if (obj.kind === "point") {
        const x = obj.x / 100 * W;
        const y = obj.y / 100 * H;
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (obj.kind === "circle") {
        const x = obj.x / 100 * W;
        const y = obj.y / 100 * H;
        const rx = obj.r / 100 * W;
        const ry = obj.r / 100 * H;
        ctx.beginPath();
        ctx.ellipse(x, y, Math.max(2, rx), Math.max(2, ry), 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeRect(obj.x / 100 * W, obj.y / 100 * H, obj.w / 100 * W, obj.h / 100 * H);
      }
      if (obj.name) {
        ctx.font = "16px sans-serif";
        ctx.fillText(obj.name, (obj.x / 100 * W) + 8, (obj.y / 100 * H) - 6);
      }
    }

    function draw() {
      if (!over.width) return;
      ctx.clearRect(0, 0, over.width, over.height);
      ctx.strokeStyle = "rgba(244,228,196,0.35)";
      ctx.fillStyle = "rgba(244,228,196,0.8)";
      ctx.lineWidth = 1;
      ctx.font = "12px sans-serif";
      for (let i = 0; i <= 20; i++) {
        const x = over.width * i / 20;
        const y = over.height * i / 20;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, over.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(over.width, y);
        ctx.stroke();
        if (i % 2 === 0) {
          ctx.fillText(i * 5 + "%", x + 2, 14);
          ctx.fillText(i * 5 + "%", 2, y + 14);
        }
      }
      items.forEach((obj) => drawOne(obj, "#7dcea0"));
      if (draft) drawOne(draft, "#f4e4c4");
    }

    function paintList() {
      const box = document.getElementById("list");
      box.innerHTML = "";
      items.forEach((obj, index) => {
        const row = document.createElement("div");
        row.className = "item";
        row.textContent = textOf(obj);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Убрать";
        btn.onclick = () => { items.splice(index, 1); paintList(); draw(); };
        row.appendChild(document.createElement("br"));
        row.appendChild(btn);
        box.appendChild(row);
      });
    }

    function setMode(next) {
      mode = next;
      draft = null;
      drag = null;
      ["point", "box", "circle"].forEach((id) => {
        document.getElementById("m-" + id).classList.toggle("on", id === next);
      });
      show(null);
      draw();
    }

    document.getElementById("file").onchange = (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      fileName = file.name;
      pic.onload = fit;
      pic.src = URL.createObjectURL(file);
    };
    document.getElementById("m-point").onclick = () => setMode("point");
    document.getElementById("m-box").onclick = () => setMode("box");
    document.getElementById("m-circle").onclick = () => setMode("circle");

    over.onmousedown = (ev) => {
      if (!pic.src) return;
      const p = at(ev);
      if (mode === "point") {
        draft = { kind: "point", x: p.x, y: p.y };
        show(draft);
        draw();
        return;
      }
      drag = p;
    };
    over.onmousemove = (ev) => {
      if (!drag) return;
      const p = at(ev);
      draft = mode === "circle" ? circle(drag, p) : square(drag, p);
      show(draft);
      draw();
    };
    window.onmouseup = () => { drag = null; };

    document.getElementById("fix").onclick = () => {
      if (!draft) return;
      const named = Object.assign({}, draft, { name: nameBox.value.trim() });
      items.push(named);
      draft = null;
      nameBox.value = "";
      show(null);
      paintList();
      draw();
    };

    document.getElementById("copy").onclick = async () => {
      const body = ["картинка: " + (fileName || "без имени")].concat(items.map(textOf)).join("\n");
      try {
        await navigator.clipboard.writeText(body);
        live.textContent = "Скопировано. Вставь мне в чат.\n\n" + body;
      } catch {
        live.textContent = "Само не скопировалось. Выдели текст ниже и скопируй.\n\n" + body;
      }
    };

    window.addEventListener("resize", fit);
  </script>
</body>
</html>
