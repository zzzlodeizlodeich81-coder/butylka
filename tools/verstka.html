<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вёрстка двора</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1a120c; color: #f4e4c4; font: 20px/1.35 system-ui, sans-serif; }
    header { padding: 14px 16px 8px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; }
    p.hint { margin: 6px 0 0; color: #c4a574; font-size: 16px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; align-items: start; }
    #stage { position: relative; background: #0c0708; min-height: 240px; touch-action: none; cursor: crosshair; }
    #pic { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    #over { position: absolute; left: 0; top: 0; pointer-events: none; }
    aside { display: flex; flex-direction: column; gap: 10px; }
    button, label.file { background: #2a1a0c; color: #f4e4c4; border: 1px solid #c4a574; border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; }
    button.on { background: #f4e4c4; color: #1a120c; }
    button.go { background: #2a6f4e; border-color: #2a6f4e; color: white; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    input[type="text"] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid #c4a574; background: #0c0708; color: #f4e4c4; }
    #live, #which { background: #0c0708; border-radius: 12px; padding: 12px; white-space: pre-wrap; }
    #live { min-height: 132px; max-height: 220px; overflow: auto; font-variant-numeric: tabular-nums; }
    #list { display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow: auto; }
    .item { background: #0c0708; border-radius: 12px; padding: 8px 10px; font-size: 16px; }
    .item button { padding: 6px 10px; font-size: 16px; margin-top: 6px; }
    label.check { display: flex; gap: 8px; align-items: center; font-size: 16px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Вёрстка</h1>
    <p class="hint">Клик по картинке ставит точку. Квадрат и круг протяни мышью. У каждой картинки свой лист.</p>
  </header>
  <main>
    <div id="stage">
      <img id="pic" alt="">
      <canvas id="over"></canvas>
    </div>
    <aside>
      <label class="file">Открыть картинку<input id="file" type="file" accept="image/*" hidden></label>
      <div class="row">
        <button type="button" id="m-point" class="on">Точка</button>
        <button type="button" id="m-box">Квадрат</button>
        <button type="button" id="m-circle">Круг</button>
      </div>
      <label class="check"><input id="even" type="checkbox" checked> Ровные стороны у квадрата</label>
      <input id="name" type="text" placeholder="Имя: во двор, болота, ангел" maxlength="40">
      <div id="which">Картинка не открыта.</div>
      <div id="live">Сначала открой картинку.</div>
      <button type="button" class="go" id="fix">Зафиксировать</button>
      <div id="list"></div>
      <button type="button" id="copy">Скопировать всё</button>
    </aside>
  </main>
  <script>
    const pic = document.getElementById("pic");
    const stage = document.getElementById("stage");
    const over = document.getElementById("over");
    const ctx = over.getContext("2d");
    const live = document.getElementById("live");
    const nameBox = document.getElementById("name");
    const even = document.getElementById("even");
    let mode = "point";
    let draft = null;
    let drag = null;
    let fileName = "";
    let books = {};
    try { books = JSON.parse(localStorage.getItem("verstka-books") || "{}") || {}; } catch (e) { books = {}; }

    function sheet() {
      if (!fileName) return [];
      if (!Array.isArray(books[fileName])) books[fileName] = [];
      return books[fileName];
    }
    function saveBooks() {
      try { localStorage.setItem("verstka-books", JSON.stringify(books)); } catch (e) {}
    }
    function pct(n) { return Math.round(n * 10) / 10; }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function place(ev) {
      const r = pic.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      return {
        x: pct(clamp((ev.clientX - r.left) / r.width * 100, 0, 100)),
        y: pct(clamp((ev.clientY - r.top) / r.height * 100, 0, 100))
      };
    }

    function square(a, b) {
      let w = b.x - a.x;
      let h = b.y - a.y;
      if (even.checked) {
        const s = Math.max(Math.abs(w), Math.abs(h));
        w = Math.sign(w || 1) * s;
        h = Math.sign(h || 1) * s;
      }
      const x = w < 0 ? a.x + w : a.x;
      const y = h < 0 ? a.y + h : a.y;
      return { kind: "box", x: pct(clamp(x, 0, 100)), y: pct(clamp(y, 0, 100)), w: pct(Math.abs(w)), h: pct(Math.abs(h)) };
    }
    function circle(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      return { kind: "circle", x: a.x, y: a.y, r: pct(Math.sqrt(dx * dx + dy * dy)) };
    }
    function textOf(obj) {
      const title = obj.name || "без имени";
      if (obj.kind === "point") return "точка «" + title + "» x " + obj.x + "% y " + obj.y + "%";
      if (obj.kind === "circle") return "круг «" + title + "» точка " + obj.x + "% " + obj.y + "% радиус " + obj.r + "%";
      if (obj.w === obj.h) return "квадрат «" + title + "» x " + obj.x + "% y " + obj.y + "% сторона " + obj.w + "%";
      return "квадрат «" + title + "» x " + obj.x + "% y " + obj.y + "% ширина " + obj.w + "% высота " + obj.h + "%";
    }
    function show(obj) {
      if (!pic.getAttribute("src")) { live.textContent = "Сначала открой картинку."; return; }
      if (!obj) { live.textContent = "Кликни по картинке."; return; }
      if (obj.kind === "point") live.textContent = "Точка\nX  " + obj.x + "%\nY  " + obj.y + "%";
      else if (obj.kind === "circle") live.textContent = "Круг\nX  " + obj.x + "%\nY  " + obj.y + "%\nрадиус  " + obj.r + "%";
      else if (obj.w === obj.h) live.textContent = "Квадрат\nX  " + obj.x + "%\nY  " + obj.y + "%\nсторона  " + obj.w + "%";
      else live.textContent = "Квадрат\nX  " + obj.x + "%\nY  " + obj.y + "%\nширина  " + obj.w + "%\nвысота  " + obj.h + "%";
    }
    function fit() {
      const w = Math.round(pic.clientWidth);
      const h = Math.round(pic.clientHeight);
      if (!w || !h) return;
      if (over.width !== w) over.width = w;
      if (over.height !== h) over.height = h;
      over.style.width = w + "px";
      over.style.height = h + "px";
      draw();
    }
    function drawOne(obj, color) {
      const W = over.width;
      const H = over.height;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;
      if (obj.kind === "point") {
        ctx.beginPath();
        ctx.arc(obj.x / 100 * W, obj.y / 100 * H, 7, 0, Math.PI * 2);
        ctx.fill();
      } else if (obj.kind === "circle") {
        ctx.beginPath();
        ctx.ellipse(obj.x / 100 * W, obj.y / 100 * H, Math.max(2, obj.r / 100 * W), Math.max(2, obj.r / 100 * H), 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.strokeRect(obj.x / 100 * W, obj.y / 100 * H, obj.w / 100 * W, obj.h / 100 * H);
      }
      if (obj.name) {
        ctx.font = "16px sans-serif";
        ctx.fillText(obj.name, obj.x / 100 * W + 8, obj.y / 100 * H - 6);
      }
    }
    function draw() {
      if (!over.width) return;
      ctx.clearRect(0, 0, over.width, over.height);
      ctx.strokeStyle = "rgba(244,228,196,0.35)";
      ctx.fillStyle = "rgba(244,228,196,0.85)";
      ctx.lineWidth = 1;
      ctx.font = "12px sans-serif";
      for (let i = 0; i <= 20; i++) {
        const x = over.width * i / 20;
        const y = over.height * i / 20;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, over.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(over.width, y); ctx.stroke();
        if (i % 2 === 0) { ctx.fillText(i * 5 + "%", x + 2, 14); ctx.fillText(i * 5 + "%", 2, y + 14); }
      }
      sheet().forEach((obj) => drawOne(obj, "#7dcea0"));
      if (draft) drawOne(draft, "#ff5a36");
    }
    function paintList() {
      const box = document.getElementById("list");
      document.getElementById("which").textContent = fileName ? fileName + " — меток " + sheet().length : "Картинка не открыта.";
      box.innerHTML = "";
      sheet().forEach((obj, index) => {
        const row = document.createElement("div");
        row.className = "item";
        row.textContent = textOf(obj);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Убрать";
        btn.onclick = () => { sheet().splice(index, 1); saveBooks(); paintList(); draw(); };
        row.appendChild(document.createElement("br"));
        row.appendChild(btn);
        box.appendChild(row);
      });
    }
    function setMode(next) {
      mode = next;
      draft = null;
      drag = null;
      ["point", "box", "circle"].forEach((id) => document.getElementById("m-" + id).classList.toggle("on", id === next));
      show(null);
      draw();
    }

    document.getElementById("file").onchange = (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      fileName = file.name;
      draft = null;
      drag = null;
      pic.onload = () => { fit(); paintList(); show(null); };
      pic.src = URL.createObjectURL(file);
    };
    document.getElementById("m-point").onclick = () => setMode("point");
    document.getElementById("m-box").onclick = () => setMode("box");
    document.getElementById("m-circle").onclick = () => setMode("circle");

    stage.addEventListener("pointerdown", (ev) => {
      if (ev.target.closest && ev.target.closest("button,input,label,a")) return;
      if (!pic.naturalWidth) { live.textContent = "Сначала открой картинку."; return; }
      const p = place(ev);
      if (!p) return;
      ev.preventDefault();
      if (mode === "point") {
        draft = { kind: "point", x: p.x, y: p.y };
        show(draft);
        draw();
        return;
      }
      drag = p;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    stage.addEventListener("pointermove", (ev) => {
      if (!drag) return;
      const p = place(ev);
      if (!p) return;
      draft = mode === "circle" ? circle(drag, p) : square(drag, p);
      show(draft);
      draw();
    });
    function stopDrag() { drag = null; }
    stage.addEventListener("pointerup", stopDrag);
    stage.addEventListener("pointercancel", stopDrag);

    document.getElementById("fix").onclick = () => {
      if (!draft || !fileName) { live.textContent = draft ? "Сначала открой картинку." : "Сначала кликни по картинке."; return; }
      sheet().push(Object.assign({}, draft, { name: nameBox.value.trim() }));
      saveBooks();
      draft = null;
      nameBox.value = "";
      show(null);
      paintList();
      draw();
    };
    document.getElementById("copy").onclick = async () => {
      const lines = [];
      Object.keys(books).forEach((name) => {
        const rows = books[name] || [];
        if (!rows.length) return;
        lines.push("картинка: " + name);
        rows.forEach((obj) => lines.push(textOf(obj)));
      });
      const body = lines.join("\n") || "Меток ещё нет.";
      try { await navigator.clipboard.writeText(body); } catch (e) {}
      live.textContent = "Скопировано. Вставь мне в чат.\n\n" + body;
    };
    if (window.ResizeObserver) new ResizeObserver(fit).observe(pic);
    window.addEventListener("resize", fit);
  </script>
</body>
</html>
